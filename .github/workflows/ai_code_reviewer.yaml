name: PR Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  automated-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install Dependencies
        run: |
          pip install requests cohere

      - name: Get PR Information
        id: get_info
        run: |
          echo "REPO_NAME=${{ github.repository }}" >> $GITHUB_ENV
          echo "PR_NUMBER=${{ github.event.number }}" >> $GITHUB_ENV

      - name: Run Cohere Review Script
        id: cohere_review
        run: |
          python3 review_with_cohere.py ${{ env.REPO_NAME }} ${{ env.PR_NUMBER }}
        env:
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Post Cohere Review to Pull Request
        if: success() && steps.cohere_review.outputs.review_message != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          message: |
            🧠 **Automated Review with Cohere Suggestions**
            ${{ steps.cohere_review.outputs.review_message }}
